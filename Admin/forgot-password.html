<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Forgot psw : Verify OTP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">


  <style>
    .btn-login {
      background: #16a34a;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-weight: 600;
      color: #fff;
      transition: 0.3s ease;
    }

    .btn-login:hover {
      background: #15803d;
      transform: translateY(-2px);
    }

    .form-control {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1.5px solid #ccc;
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
        background-color: #fff; 
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .form-control:focus {
        border-color: #4a90e2;
        box-shadow: 0 0 6px rgba(74, 144, 226, 0.25);
    }

    .form-control.error {
        border-color: #e63946;
        box-shadow: 0 0 6px rgba(230, 57, 70, 0.2);
    }

    .form-control.success {
        border-color: #2ecc71;
        box-shadow: 0 0 6px rgba(46, 204, 113, 0.2);
    }

    .form-control .text-danger, .form-control .text-success {
        font-size: 0.85rem;
        margin-top: 4px;
        display: block;
        transition: all 0.3s ease;
    }

    .form-control .text-danger {
        color: #e63946;
    }

    .form-control .text-success {
        color: #2ecc71;
    }

    .form-control .input-wrapper {
        position: relative;
    }

    .form-control .input-wrapper .form-control.error::after,
    .form-control .input-wrapper .form-control.success::after {
        content: '';
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1rem;
        pointer-events: none;
    }

    .form-control .input-wrapper .form-control.error::after {
        content: '⚠';
        color: #e63946;
    }

    .form-control .input-wrapper .form-control.success::after {
        content: '✔';
        color: #2ecc71;
    }


  </style>
</head>

<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg rounded-4 w-100" style="max-width: 900px;">
      <div class="row g-0 flex-column flex-md-row">

        <!-- Image (shows on all screens now) -->
        <div class="col-12 col-md-6 d-flex align-items-center justify-content-center bg-light">
          <img src="IMG/index/forgot_psw.png" alt="OTP Illustration" class="img-fluid p-3"
            style="max-height: 100%; object-fit: contain;">
        </div>

        <!-- Form -->
        <div class="col-12 col-md-6 d-flex align-items-center">
          <div class="p-4 p-md-5 w-100">

            <h2 class="mb-3 text-success text-center text-md-start">Verify OTP</h2>
            <p class="text-muted mb-4 text-center text-md-start">
              An OTP has been sent to your registered email address:
              <strong class="text-dark">har******96@gmail.com</strong>
            </p>

            <!-- Success Alert Example -->
            <div class="alert alert-success text-center" role="alert">
              OTP sent successfully!
            </div>

            <form id="otpForm" action="fpsw.html" method="get" onsubmit="return validateOTP()">

              <div class="mb-4">
                <label class="form-label">Enter OTP</label>

                <div class="d-flex justify-content-between gap-2">
                  <input type="text" id="otp1" maxlength="1" class="form-control text-center fs-4">
                  <input type="text" id="otp2" maxlength="1" class="form-control text-center fs-4">
                  <input type="text" id="otp3" maxlength="1" class="form-control text-center fs-4">
                  <input type="text" id="otp4" maxlength="1" class="form-control text-center fs-4">
                </div>

                <small id="errOTP" class="text-danger fw-semibold"></small>
              </div>

              <div id="successBox" class="alert alert-success d-none">
                OTP Verified Successfully!
              </div>

              <button type="submit" class="btn btn-login w-100 mt-3">Verify OTP</button>

            </form>


            <div class="mt-3 text-center">
              <a href="index.html" class="text-success text-decoration-none">Back to Login</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>


  <script>
    function validateOTP() {
      let o1 = document.getElementById("otp1");
      let o2 = document.getElementById("otp2");
      let o3 = document.getElementById("otp3");
      let o4 = document.getElementById("otp4");

      let errOTP = document.getElementById("errOTP");
      let successBox = document.getElementById("successBox");

      o1.classList.remove("error", "success");
      o2.classList.remove("error", "success");
      o3.classList.remove("error", "success");
      o4.classList.remove("error", "success");

      const icon = '<i class="bi bi-exclamation-circle-fill"></i> ';

      errOTP.innerHTML = "";
      successBox.classList.add("d-none");

      let otp = o1.value + o2.value + o3.value + o4.value;

      if (otp.trim().length < 4) {
        errOTP.innerHTML = `${icon} Please enter all 4 digits of OTP.`;
        o1.classList.add("error");
        o2.classList.add("error");
        o3.classList.add("error");
        o4.classList.add("error");
        return false;
      }

      if (!/^[0-9]{4}$/.test(otp)) {
        errOTP.innerHTML = `${icon} OTP must contain only numbers.`;
        o1.classList.add("error");
        o2.classList.add("error");
        o3.classList.add("error");
        o4.classList.add("error");
        return false;
      }

      o1.classList.add("success");
      o2.classList.add("success");
      o3.classList.add("success");
      o4.classList.add("success");

      

      successBox.classList.remove("d-none");

      setTimeout(() => {
        document.getElementById("otpForm").submit();
      }, 2000);

      return false;
    }
  </script>


</body>

</html>
