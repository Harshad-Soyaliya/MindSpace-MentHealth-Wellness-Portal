<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Exercise : Edit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Quicksand:wght@600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link href="css/style.css" rel="stylesheet">

  <style>
    .form-control,
    .form-label {
      font-size: 1rem;
    }

    .step-card {
      background: #f8f9fa;
      border-left: 4px solid #4CAF50;
      border-radius: 8px;
      padding: 1rem;
      flex-shrink: 0;
    }

    .scroll-container {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .scroll-container::-webkit-scrollbar {
      height: 8px;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background: #4CAF50;
      border-radius: 4px;
    }
  </style>

</head>

<body>

  <div class="container mt-5">
    <div class="dashboard-header">Add / Edit Exercise</div>

    <nav aria-label="breadcrumb" class="breadcrumb-container">
      <ol class="breadcrumb mb-0 flex-wrap">
        <li class="breadcrumb-item">
          <a href="dashboard.html" class="breadcrumb-link">Dashboard</a>
        </li>
        <li class="breadcrumb-item">
          <a href="self-help-tools.html" class="breadcrumb-link">Self - Help Tools</a>
        </li>
        <li class="breadcrumb-item">
          <a href="manage-exercise.html" class="breadcrumb-link">Manage Exercise</a>
        </li>
        <li class="breadcrumb-item active text-dark" aria-current="page">Add - Edit Exercise</li>
      </ol>
    </nav>

    <div class="dashboard-content">

      <!-- Edit Exercise Form -->
      <form method="get" action="manage-exercise.html" id="addeditexercise" onsubmit="return validateExerciseForm()">

        <div class="mb-3">
          <label class="form-label fw-semibold">Exercise Title</label>
          <input type="text" class="form-control" id="exerciseTitle" value="Morning Stretch">
          <small id="errTitle" class="text-danger"></small>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Exercise Description</label>
          <textarea class="form-control" id="exerciseDescription"
            rows="4">A set of simple stretches to wake up your body in the morning.</textarea>
          <small id="errDesc" class="text-danger"></small>
        </div>

        <button type="button" class="btn btn-success btn-sm mb-3"><i class="bi bi-plus-circle"></i> Add Step</button>

        <div class="mb-3">
          <label class="form-label fw-semibold">Exercise Steps</label>

          <div class="scroll-container mb-3" id="stepsContainer">

            <div class="step-card d-flex flex-column p-3 mb-3">
              <div class="d-flex align-items-center mb-2 gap-2">
                <input type="number" class="form-control form-control-sm rounded-pill text-center" value="1"
                  style="width: 60px;">
                <input type="text" class="form-control form-control-sm rounded-pill fw-bold" value="title">
                <button type="button" class="btn btn-outline-success btn-sm ms-auto"><i
                    class="bi bi-trash"></i></button>
              </div>
              <textarea class="form-control rounded-4" rows="2">Stand tall, stretch arms overhead.</textarea>
            </div>

            <div class="step-card d-flex flex-column p-3 mb-3">
              <div class="d-flex align-items-center mb-2 gap-2">
                <input type="number" class="form-control form-control-sm rounded-pill text-center" value="2"
                  style="width: 60px;">
                <input type="text" class="form-control form-control-sm rounded-pill fw-bold" value="title">
                <button type="button" class="btn btn-outline-success btn-sm ms-auto"><i
                    class="bi bi-trash"></i></button>
              </div>
              <textarea class="form-control rounded-4" rows="2">Bend sideways gently to stretch the sides.</textarea>
            </div>

            <div class="step-card d-flex flex-column p-3 mb-3">
              <div class="d-flex align-items-center mb-2 gap-2">
                <input type="number" class="form-control form-control-sm rounded-pill text-center" value="3"
                  style="width: 60px;">
                <input type="text" class="form-control form-control-sm rounded-pill fw-bold" value="title">
                <button type="button" class="btn btn-outline-success btn-sm ms-auto"><i
                    class="bi bi-trash"></i></button>
              </div>
              <textarea class="form-control rounded-4" rows="2">Twist torso gently from left to right.</textarea>
            </div>

          </div>
          <small id="errSteps" class="text-danger"></small>
        </div>

        <div id="successBox" class="alert alert-success d-none">
          Exercise updated successfully!
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success rounded-pill"><i class="bi bi-save"></i> Save Changes</button>
          <a href="manage-exercise.html" class="btn btn-secondary rounded-pill"><i class="bi bi-x-circle"></i>
            Cancel</a>
        </div>

        

      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function validateExerciseForm() {
      const errTitle = document.getElementById("errTitle");
      const errDesc = document.getElementById("errDesc");
      const errSteps = document.getElementById("errSteps");
      const successBox = document.getElementById("successBox");

      errTitle.innerHTML = "";
      errDesc.innerHTML = "";
      errSteps.innerHTML = "";
      successBox.classList.add("d-none");

      let valid = true;
      const icon = '<i class="bi bi-exclamation-circle-fill"></i> ';

      const titleEl = document.getElementById("exerciseTitle");
      const title = titleEl.value.trim();
      titleEl.classList.remove("error", "success");
      if (title == "") {
        errTitle.innerHTML = `${icon} Please enter a title.`;
        titleEl.classList.add("error");
        valid = false;
      } else if (!isNaN(title)) {
        errTitle.innerHTML = `${icon} Title must contain letters.`;
        titleEl.classList.add("error");
        valid = false;
      } else if (title.length > 100) {
        errTitle.innerHTML = `${icon} Title must be under 100 characters.`;
        titleEl.classList.add("error");
        valid = false;
      } else {
        titleEl.classList.add("success");
      }

      const descEl = document.getElementById("exerciseDescription");
      const desc = descEl.value.trim();
      descEl.classList.remove("error", "success");
      if (desc == "") {
        errDesc.innerHTML = `${icon} Please enter a description.`;
        descEl.classList.add("error");
        valid = false;
      } else if (desc.length < 10) {
        errDesc.innerHTML = `${icon} Description must be at least 10 characters.`;
        descEl.classList.add("error");
        valid = false;
      } else {
        descEl.classList.add("success");
      }

      const steps = document.getElementsByClassName("step-card");
      if (steps.length < 1) {
        errSteps.innerHTML = `${icon} Please add at least one step.`;
        valid = false;
      } else {
        for (let i = 0; i < steps.length; i++) {
          const stepCard = steps[i];
          const stepNoEl = stepCard.getElementsByTagName("input")[0];
          const stepTitleEl = stepCard.getElementsByTagName("input")[1];
          const stepDescEl = stepCard.getElementsByTagName("textarea")[0];

          stepNoEl.classList.remove("error", "success");
          stepTitleEl.classList.remove("error", "success");
          stepDescEl.classList.remove("error", "success");

          const stepNo = stepNoEl.value.trim();
          const stepTitle = stepTitleEl.value.trim();
          const stepDesc = stepDescEl.value.trim();

          if (stepNo == "" || stepTitle == "" || stepDesc == "") {
            errSteps.innerHTML = `${icon} All steps must be fully filled.`;
            stepNoEl.classList.add("error");
            stepTitleEl.classList.add("error");
            stepDescEl.classList.add("error");
            valid = false;
            break;
          } else {
            stepNoEl.classList.add("success");
            stepTitleEl.classList.add("success");
            stepDescEl.classList.add("success");
          }
        }
      }

      if (!valid) return false;

      successBox.classList.remove("d-none");

      setTimeout(() => {
        successBox.classList.add("d-none");
        document.getElementById("addeditexercise").submit();
      }, 1500);

      return false;
    }
  </script>


</body>

</html>
