<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Exercise : Edit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Quicksand:wght@600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link href="css/style.css" rel="stylesheet">

  <style>

    .form-control,
    .form-label {
      font-size: 1rem;
    }

    .step-card {
      background: #f8f9fa;
      border-left: 4px solid #4CAF50;
      border-radius: 8px;
      padding: 1rem;
      flex-shrink: 0;
    }

    .scroll-container {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .scroll-container::-webkit-scrollbar {
      height: 8px;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background: #4CAF50;
      border-radius: 4px;
    }
  </style>

</head>

<body>

  <div class="container mt-5">
    <div class="dashboard-header">Edit Exercise</div>

    <nav aria-label="breadcrumb" class="breadcrumb-container">
      <ol class="breadcrumb mb-0 flex-wrap">
        <li class="breadcrumb-item">
          <a href="dashboard.html" class="breadcrumb-link">Dashboard</a>
        </li>
        <li class="breadcrumb-item">
          <a href="self-help-tools.html" class="breadcrumb-link">Self - Help Tools</a>
        </li>
        <li class="breadcrumb-item">
          <a href="manage-exercise.html" class="breadcrumb-link">Manage Exercise</a>
        </li>
        <li class="breadcrumb-item active text-dark" aria-current="page">Edit Exercise</li>
      </ol>
    </nav>

    <div class="dashboard-content">

      <!-- Edit Exercise Form -->
      <form onsubmit="return validateExerciseForm()">

        <div class="mb-3">
          <label class="form-label fw-semibold">Exercise Title</label>
          <input type="text" class="form-control" id="exerciseTitle" value="Morning Stretch">
          <small id="errTitle" class="text-danger"></small>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Exercise Description</label>
          <textarea class="form-control" id="exerciseDescription" rows="4">A set of simple stretches to wake up your body in the morning.</textarea>
          <small id="errDesc" class="text-danger"></small>
        </div>

        <button type="button" class="btn btn-success btn-sm mb-3"><i class="bi bi-plus-circle"></i> Add Step</button>

        <div class="mb-3">
          <label class="form-label fw-semibold">Exercise Steps</label>

          <div class="scroll-container mb-3" id="stepsContainer">

            <div class="step-card d-flex flex-column p-3 mb-3">
              <div class="d-flex align-items-center mb-2 gap-2">
                <input type="number" class="form-control form-control-sm rounded-pill text-center" value="1" style="width: 60px;">
                <input type="text" class="form-control form-control-sm rounded-pill fw-bold" value="title">
                <button type="button" class="btn btn-outline-success btn-sm ms-auto"><i class="bi bi-trash"></i></button>
              </div>
              <textarea class="form-control rounded-4" rows="2">Stand tall, stretch arms overhead.</textarea>
            </div>

            <div class="step-card d-flex flex-column p-3 mb-3">
              <div class="d-flex align-items-center mb-2 gap-2">
                <input type="number" class="form-control form-control-sm rounded-pill text-center" value="2" style="width: 60px;">
                <input type="text" class="form-control form-control-sm rounded-pill fw-bold" value="title">
                <button type="button" class="btn btn-outline-success btn-sm ms-auto"><i class="bi bi-trash"></i></button>
              </div>
              <textarea class="form-control rounded-4" rows="2">Bend sideways gently to stretch the sides.</textarea>
            </div>

            <div class="step-card d-flex flex-column p-3 mb-3">
              <div class="d-flex align-items-center mb-2 gap-2">
                <input type="number" class="form-control form-control-sm rounded-pill text-center" value="3" style="width: 60px;">
                <input type="text" class="form-control form-control-sm rounded-pill fw-bold" value="title">
                <button type="button" class="btn btn-outline-success btn-sm ms-auto"><i class="bi bi-trash"></i></button>
              </div>
              <textarea class="form-control rounded-4" rows="2">Twist torso gently from left to right.</textarea>
            </div>

          </div>

          <small id="errSteps" class="text-danger"></small>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success rounded-pill"><i class="bi bi-save"></i> Save Changes</button>
          <a href="manage-exercise.html" class="btn btn-secondary rounded-pill"><i class="bi bi-x-circle"></i> Cancel</a>
        </div>

        <!-- SUCCESS MESSAGE -->
        <div id="successBox" class="text-success fw-semibold mt-3 d-none">
          Exercise updated successfully!
        </div>

      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
function validateExerciseForm() {

  document.getElementById("errTitle").innerHTML = "";
  document.getElementById("errDesc").innerHTML = "";
  document.getElementById("errSteps").innerHTML = "";

  let title = document.getElementById("exerciseTitle").value.trim();
  let desc = document.getElementById("exerciseDescription").value.trim();
  let steps = document.getElementsByClassName("step-card");

  let valid = true;

  // Title
  if (title === "") {
    document.getElementById("errTitle").innerHTML = "Please enter a title.";
    valid = false;
  }

  // Description
  if (desc === "") {
    document.getElementById("errDesc").innerHTML = "Please enter a description.";
    valid = false;
  }

  // Steps count
  if (steps.length === 0) {
    document.getElementById("errSteps").innerHTML = "Please add at least one step.";
    valid = false;
  }

  // Validate each step
  for (let i = 0; i < steps.length; i++) {
    let stepNo = steps[i].getElementsByTagName("input")[0].value.trim();
    let stepTitle = steps[i].getElementsByTagName("input")[1].value.trim();
    let stepDesc = steps[i].getElementsByTagName("textarea")[0].value.trim();

    if (stepNo === "" || stepTitle === "" || stepDesc === "") {
      document.getElementById("errSteps").innerHTML = "All steps must be fully filled.";
      valid = false;
      break;
    }
  }

  if (!valid) return false;

  // SUCCESS
  let box = document.getElementById("successBox");
  box.classList.remove("d-none");

  // Clear fields
  document.getElementById("exerciseTitle").value = "";
  document.getElementById("exerciseDescription").value = "";

  // Clear all steps
  let container = document.getElementById("stepsContainer");
  container.innerHTML = "";

  // Hide after 2 sec + redirect
  setTimeout(function () {
    box.classList.add("d-none");
    window.location.href = "manage-exercise.html";
  }, 2000);

  return false;
}
</script>


</body>

</html>
