<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      max-width: 900px;
      width: 100%;
    }

    .login-form {
      padding: 2rem;
    }

    .login-form h2 {
      font-weight: 600;
      color: #166534;
    }

    .form-control {
      border-radius: 10px;
      padding: 0.8rem;
    }

    .btn-login {
      background: #16a34a;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-weight: 600;
      color: #fff;
      transition: 0.3s ease;
    }

    .btn-login:hover {
      background: #15803d;
      transform: translateY(-2px);
    }

    .extra-links {
      text-align: center;
      margin-top: 1rem;
    }

    .extra-links a {
      color: #16a34a;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    /* Responsive tweaks */
    @media (max-width: 767.98px) {
      .login-form {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="row login-card g-0">

      <!-- Image -->
      <div class="col-12 col-md-6">
        <img src="IMG/index/login.png" alt="Login Illustration" class="img-fluid w-100 h-100">
      </div>

      <!-- Form -->
      <div class="col-12 col-md-6 d-flex align-items-center">
        <div class="login-form w-100">
          <h2 class="mb-3 text-success">Admin Login</h2>
          <p class="text-muted mb-4">Sign in to access your dashboard</p>

        <form id="loginForm" action="dashboard.html" method="GET" onsubmit="return validateLogin()">

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="admin@example.com">
              <small id="errEmail" class="text-danger fw-semibold"></small>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Enter password">
              <small id="errPass" class="text-danger fw-semibold"></small>
            </div>

            <div id="successBox" class="alert alert-success d-none mt-3">
              Login successful!
            </div>

            <button type="submit" class="btn btn-login w-100 mt-2">Login</button>

        </form>


          <div class="extra-links">
            <a href="forgot-password.html">Forgot Password?</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
function validateLogin() {
    let email = document.getElementById("email");
    let pass = document.getElementById("password");

    let errEmail = document.getElementById("errEmail");
    let errPass = document.getElementById("errPass");
    let successBox = document.getElementById("successBox");

    let valid = true;

    // Reset
    errEmail.innerHTML = "";
    errPass.innerHTML = "";
    successBox.classList.add("d-none");
    email.classList.remove("error", "success");
    pass.classList.remove("error", "success");

    // Basic Validation
    if (email.value.trim() === "") {
        errEmail.innerHTML = "Please enter your email.";
        email.classList.add("error");
        valid = false;
    } else {
        email.classList.add("success");
    }

    if (pass.value.trim() === "") {
        errPass.innerHTML = "Please enter your password.";
        pass.classList.add("error");
        valid = false;
    } else {
        pass.classList.add("success");
    }

    if (!valid) return false;

    // ✅ Exact Login Check
    if (email.value !== "harshad@gmail.com" || pass.value !== "Harshad@2005") {
        errPass.innerHTML = "Incorrect email or password!";
        pass.classList.add("error");
        return false;
    }

    // Success message + redirect
    successBox.classList.remove("d-none");

    setTimeout(() => {
        document.getElementById("loginForm").submit();
    }, 2000);

    return false;
}
</script>


</body>

</html>
