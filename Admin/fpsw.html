<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Forgot psw : set Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">


  <style>

    .form-control {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1.5px solid #ccc;
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
        background-color: #fff; 
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .form-control:focus {
        border-color: #4a90e2;
        box-shadow: 0 0 6px rgba(74, 144, 226, 0.25);
    }

    .form-control.error {
        border-color: #e63946;
        box-shadow: 0 0 6px rgba(230, 57, 70, 0.2);
    }

    .form-control.success {
        border-color: #2ecc71;
        box-shadow: 0 0 6px rgba(46, 204, 113, 0.2);
    }

    .form-control .text-danger, .form-control .text-success {
        font-size: 0.85rem;
        margin-top: 4px;
        display: block;
        transition: all 0.3s ease;
    }

    .form-control .text-danger {
        color: #e63946;
    }

    .form-control .text-success {
        color: #2ecc71;
    }

    .form-control .input-wrapper {
        position: relative;
    }

    .form-control .input-wrapper .form-control.error::after,
    .form-control .input-wrapper .form-control.success::after {
        content: '';
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1rem;
        pointer-events: none;
    }

    .form-control .input-wrapper .form-control.error::after {
        content: '⚠';
        color: #e63946;
    }

    .form-control .input-wrapper .form-control.success::after {
        content: '✔';
        color: #2ecc71;
    }


    .btn-login {
      background: #16a34a;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-weight: 600;
      color: #fff;
      transition: 0.3s ease;
    }

    .btn-login:hover {
      background: #15803d;
      transform: translateY(-2px);
    }

    @media (max-width: 767.98px) {
      .reverse-on-mobile {
        flex-direction: column;
      }

      .reverse-on-mobile .image-col {
        order: 1;
      }

      .reverse-on-mobile .form-col {
        order: 2;
      }
    }
  </style>

</head>

<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg rounded-4 w-100" style="max-width: 900px;">
      <div class="row g-0 d-flex reverse-on-mobile">

        <!-- Image -->
        <div class="col-md-6 col-12 d-flex align-items-center justify-content-center image-col">
          <img src="IMG/index/forgot_psw_confirm.png" alt="Reset Password Illustration" class="img-fluid p-3"
            style="max-height: 100%; object-fit: contain;">
        </div>

        <!-- Form -->
        <div class="col-md-6 col-12 d-flex align-items-center form-col">
          <div class="p-4 p-md-5 w-100">
            <h2 class="mb-3 text-success">Reset Password</h2>
            <p class="text-muted mb-4">Enter your new password below to reset your account password.</p>

            <form id="pswForm" action="index.html" method="get" onsubmit="return validatePassword()">

              <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" placeholder="Enter new password">
                <small id="errNew" class="text-danger fw-semibold"></small>
              </div>

              <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter new password">
                <small id="errConfirm" class="text-danger fw-semibold"></small>
              </div>

              <div id="successBox" class="alert alert-success d-none">
                Password changed successfully!
              </div>

              <button type="submit" class="btn btn-login w-100 mt-2">Change Password</button>
            </form>


            <div class="mt-3 text-center">
              <a href="index.html" class="text-success text-decoration-none">Back to Login</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function validatePassword() {
      let newP = document.getElementById("newPassword");
      let confirmP = document.getElementById("confirmPassword");

      let errNew = document.getElementById("errNew");
      let errConfirm = document.getElementById("errConfirm");
      let successBox = document.getElementById("successBox");

      let valid = true;

      const icon = '<i class="bi bi-exclamation-circle-fill"></i> ';

      errNew.innerHTML = "";
      errConfirm.innerHTML = "";
      successBox.classList.add("d-none");

      newP.classList.remove("error", "success");
      confirmP.classList.remove("error", "success");

      let strongPass = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@#$%^&+=!]).{8,}$/;

      if (newP.value.trim() == "") {
        errNew.innerHTML = `${icon} Please enter a new password.`;
        newP.classList.add("error");
        valid = false;
      }
      else if (!strongPass.test(newP.value.trim())) {
        errNew.innerHTML = `${icon} Password must be at least 8 characters, include uppercase, lowercase, number, and symbol.`;
        newP.classList.add("error");
        valid = false;
      }
      else {
        newP.classList.add("success");
      }

      if (confirmP.value.trim() == "") {
        errConfirm.innerHTML = `${icon} Please confirm your password.`;
        confirmP.classList.add("error");
        valid = false;
      }
      else if (newP.value !== confirmP.value) {
        errConfirm.innerHTML = `${icon} Passwords do not match!`;
        confirmP.classList.add("error");
        valid = false;
      }
      else {
        confirmP.classList.add("success");
      }

      if (!valid) return false;

      successBox.classList.remove("d-none");

      setTimeout(() => {
        document.getElementById("pswForm").submit();
      }, 2000);

      return false;
    }
  </script>


</body>

</html>
