<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Forgot psw : set Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .btn-login {
      background: #16a34a;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-weight: 600;
      color: #fff;
      transition: 0.3s ease;
    }

    .btn-login:hover {
      background: #15803d;
      transform: translateY(-2px);
    }

    @media (max-width: 767.98px) {
      .reverse-on-mobile {
        flex-direction: column;
      }

      .reverse-on-mobile .image-col {
        order: 1;
      }

      .reverse-on-mobile .form-col {
        order: 2;
      }
    }
  </style>

</head>

<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg rounded-4 w-100" style="max-width: 900px;">
      <div class="row g-0 d-flex reverse-on-mobile">

        <!-- Image -->
        <div class="col-md-6 col-12 d-flex align-items-center justify-content-center image-col">
          <img src="IMG/index/forgot_psw_confirm.png" alt="Reset Password Illustration" class="img-fluid p-3"
            style="max-height: 100%; object-fit: contain;">
        </div>

        <!-- Form -->
        <div class="col-md-6 col-12 d-flex align-items-center form-col">
          <div class="p-4 p-md-5 w-100">
            <h2 class="mb-3 text-success">Reset Password</h2>
            <p class="text-muted mb-4">Enter your new password below to reset your account password.</p>

            <form action="index.html" method="get">
              <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword"
                  placeholder="Enter new password" required>
              </div>

              <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                  placeholder="Re-enter new password" required>
              </div>

              <button type="submit" class="btn btn-login w-100">Change Password</button>
            </form>

            <div class="mt-3 text-center">
              <a href="index.html" class="text-success text-decoration-none">Back to Login</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>

</html>
